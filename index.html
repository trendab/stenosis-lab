<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stenosis Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab bench — one instrument (the vessel) per station, numbered stations in teaching order, readouts in mono like a lab protocol */
:root{
  --paper:#EEF2F1; --panel:#FFFFFF; --ink:#16222E; --muted:#56646F; --line:#C9D2D6;
  --blood:#B0132B; --plaque:#D89A1C; --wall:#E7C9C4; --lumen:#FBF3EF; --tech:#1F5A8C; --ok:#2C7A4B;
  --media:#D6A8A2; --intima:#F2DCD5; --cap:#C4847F; --clot:#6E0F1E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1518; --panel:#172126; --ink:#E5ECEE; --muted:#97A5AE; --line:#2B3840;
  --blood:#E8485D; --plaque:#E2AE45; --wall:#5A3A3C; --lumen:#24191B; --tech:#72AADB; --ok:#5DBB83;
  --media:#6E4446; --intima:#3B2A2C; --cap:#93605F; --clot:#C23A4E; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0F1518; --panel:#172126; --ink:#E5ECEE; --muted:#97A5AE; --line:#2B3840;
  --blood:#E8485D; --plaque:#E2AE45; --wall:#5A3A3C; --lumen:#24191B; --tech:#72AADB; --ok:#5DBB83;
  --media:#6E4446; --intima:#3B2A2C; --cap:#93605F; --clot:#C23A4E; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.eyebrow b{color:var(--blood);font-weight:500}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:.95;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 span{color:var(--blood)}
.lead{max-width:62ch;color:var(--muted);margin:10px 0 0}
.lang{display:flex;gap:4px;font-family:var(--mono);font-size:12px}
.lang button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 9px;border-radius:4px;cursor:pointer;font:inherit}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;font:inherit;padding:0;border:2px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;overflow:hidden;min-width:0}
.card canvas{width:100%;height:120px;display:block}
.card .badge{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--mono);font-weight:500;display:grid;place-items:center}
.card.good{border-color:var(--ok)} .card.bad{border-color:var(--blood)}
.stagehead{font-family:var(--mono);font-size:12px;color:var(--blood);letter-spacing:.06em;text-transform:uppercase;margin:0}
@media (max-width:600px){.tab{flex-direction:column;gap:0}.tab .s{display:none}}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:2px solid var(--ink)}
.tab{background:transparent;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:12px 6px 10px;text-align:left;cursor:pointer;color:var(--muted);font:inherit;display:flex;gap:10px;align-items:baseline;min-width:0}
.tab .n{font-family:var(--mono);font-size:12px}
.tab .l{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.4vw,20px);color:inherit}
.tab .s{display:block;font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blood)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--tech);outline-offset:2px}

.station{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.station{grid-template-columns:minmax(0,1fr)}}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
canvas.vessel{width:100%;height:220px;display:block;border-radius:4px;background:var(--panel)}
canvas.plot{width:100%;height:260px;display:block}
.playbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.btn{font:inherit;font-weight:600;border-radius:4px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500;padding:6px 10px}
.btn.accent{background:var(--blood);border-color:var(--blood);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-family:var(--mono);font-size:12px;border:0;background:transparent;color:var(--muted);padding:6px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tech);color:#fff}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.task{font-size:17px;max-width:60ch;margin:0}
.task strong{color:var(--blood)}
.ctrl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.ctrl label{font-size:14px}
.ctrl output{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right;min-width:5ch}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--blood)}
input[type=range].unset::-webkit-slider-thumb{opacity:0}
input[type=range].unset::-moz-range-thumb{opacity:0}
.readout{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.readout .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.readout .unit{color:var(--muted);font-size:13px}
.note{font-size:13px;color:var(--muted);margin:0}
.result{border-left:4px solid var(--tech);padding:8px 12px;background:color-mix(in srgb,var(--tech) 8%,transparent);border-radius:0 4px 4px 0;font-size:14px}
.result.bad{border-left-color:var(--blood);background:color-mix(in srgb,var(--blood) 8%,transparent)}
.result.good{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.score b{color:var(--ink);font-size:18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);background:color-mix(in srgb,var(--line) 35%,transparent)}
td.chg{color:var(--blood);font-weight:500}
ol.tasks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.warn{font-size:14px;color:var(--blood);margin:0}

.cases{display:flex;flex-wrap:wrap;gap:8px}
.case{font:inherit;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;padding:8px 10px;cursor:pointer;flex:1 1 140px;min-width:0}
.case small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.case[aria-pressed="true"]{border-color:var(--blood);box-shadow:inset 0 0 0 1px var(--blood)}
.gauge{position:relative;height:26px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--line) 30%,transparent)}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .25s}
.gauge .target{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.gauge .tl{position:absolute;top:3px;font-family:var(--mono);font-size:11px;color:var(--ink);padding-left:5px}
.formula{font-family:var(--mono);font-size:14px;background:color-mix(in srgb,var(--tech) 8%,transparent);padding:10px 12px;border-radius:4px;overflow-x:auto}

.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.below{grid-template-columns:minmax(0,1fr)}}
details{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:17px}
details ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
details p{font-size:14px;margin:10px 0 0}
@media (prefers-reduced-motion: reduce){.gauge .fill{transition:none}}
</style>
</head><body>


<div class="wrap">
  <header>
    <div>
      <p class="eyebrow"><b>●</b> <span data-t="eyebrow"></span></p>
      <h1 data-t-html="title"></h1>
      <p class="lead" data-t="lead"></p>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-plaque" aria-selected="true" aria-controls="plaque"><span class="n">01</span><span><span class="l" data-t="tab0"></span><span class="s" data-t="tab0s"></span></span></button>
    <button class="tab" role="tab" id="tab-predict" aria-selected="false" aria-controls="predict"><span class="n">02</span><span><span class="l" data-t="tab1"></span><span class="s" data-t="tab1s"></span></span></button>
    <button class="tab" role="tab" id="tab-lab" aria-selected="false" aria-controls="lab"><span class="n">03</span><span><span class="l" data-t="tab2"></span><span class="s" data-t="tab2s"></span></span></button>
    <button class="tab" role="tab" id="tab-patient" aria-selected="false" aria-controls="patient"><span class="n">04</span><span><span class="l" data-t="tab3"></span><span class="s" data-t="tab3s"></span></span></button>
  </nav>

  <!-- 01 PLAQUE -->
  <section id="plaque" role="tabpanel" class="station">
    <div class="bench">
      <div class="seg" id="pl-mode" style="align-self:flex-start">
        <button data-m="order" aria-pressed="true" data-t="mOrder"></button>
        <button data-m="anim" aria-pressed="false" data-t="mAnim"></button>
      </div>
      <div id="pl-order" style="display:flex;flex-direction:column;gap:10px">
        <p class="task" data-t="orderTask"></p>
        <div class="cards" id="pl-cards"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn accent" id="pl-check" data-t="check" disabled></button>
          <button class="btn ghost" id="pl-shuffle" data-t="shuffle"></button>
        </div>
        <div id="pl-ores" class="result" hidden></div>
      </div>
      <div id="pl-anim" hidden style="display:flex;flex-direction:column;gap:10px">
        <canvas class="vessel" id="cv-plaque" style="height:240px"></canvas>
        <div class="playbar">
          <button class="btn ghost" id="pl-prev"></button>
          <span class="seg" id="pl-chips"></span>
          <button class="btn ghost" id="pl-next"></button>
          <button class="btn ghost" id="pl-pause"></button>
          <button class="btn ghost" id="pl-replay"></button>
        </div>
      </div>
    </div>
    <div class="side">
      <div class="bench" id="pl-info">
        <p class="stagehead" id="pl-step"></p>
        <h2 id="pl-h"></h2>
        <p id="pl-txt" style="margin:0;max-width:60ch"></p>
      </div>
      <p class="note" data-t="plNote"></p>
    </div>
  </section>

  <!-- 02 PREDICT -->
  <section id="predict" role="tabpanel" class="station" hidden>
    <div class="bench">
      <canvas class="vessel" id="cv-predict"></canvas>
      <div class="playbar" data-sim="predict"></div>
      <p class="task" id="p-task"></p>
      <div class="ctrl">
        <label for="p-guess" data-t="yourGuess"></label>
        <output id="p-guess-out">– %</output>
        <input type="range" id="p-guess" class="unset" min="0" max="100" step="1" value="0" aria-label="Prediction slider">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn accent" id="p-lock" data-t="lock" disabled></button>
        <button class="btn" id="p-next" hidden data-t="next"></button>
        <button class="btn ghost" id="p-restart" hidden data-t="restart"></button>
      </div>
      <div id="p-result" class="result" hidden></div>
    </div>
    <div class="side">
      <div class="bench">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
          <h3 data-t="plotTitle"></h3>
          <span class="score"><span data-t="points"></span> <b id="p-score">0</b> / 300</span>
        </div>
        <canvas class="plot" id="cv-plot"></canvas>
        <div class="legend">
          <span><i style="border:2px solid var(--tech)"></i><span data-t="lgGuess"></span></span>
          <span><i style="background:var(--blood)"></i><span data-t="lgReal"></span></span>
          <span id="lg-curves" hidden><i style="background:var(--ink);border-radius:0;height:2px;width:14px"></i><span data-t="lgCurves"></span></span>
        </div>
      </div>
      <p class="note" data-t="predictNote"></p>
    </div>
  </section>

  <!-- 02 LAB -->
  <section id="lab" role="tabpanel" class="station" hidden>
    <div class="bench">
      <canvas class="vessel" id="cv-lab"></canvas>
      <div class="playbar" data-sim="lab"></div>
      <div class="readout"><span class="big" id="l-flow">100 %</span><span class="unit" data-t="flowUnit"></span></div>
      <div class="ctrl"><label for="l-r" data-t="radius"></label><output id="l-r-out"></output><input type="range" id="l-r" min="30" max="100" step="5" value="70"></div>
      <div class="ctrl"><label for="l-L" data-t="length"></label><output id="l-L-out"></output><input type="range" id="l-L" min="50" max="200" step="10" value="100"></div>
      <div class="ctrl"><label for="l-P" data-t="pressure"></label><output id="l-P-out"></output><input type="range" id="l-P" min="50" max="200" step="10" value="100"></div>
      <div class="ctrl"><label for="l-mu" data-t="viscosity"></label><output id="l-mu-out"></output><input type="range" id="l-mu" min="50" max="200" step="10" value="100"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn accent" id="l-log" data-t="log"></button>
        <button class="btn ghost" id="l-reset" data-t="reset"></button>
      </div>
      <p class="warn" id="l-warn" hidden></p>
    </div>
    <div class="side">
      <div class="bench">
        <h3 data-t="tasksTitle"></h3>
        <ol class="tasks"><li data-t="t1"></li><li data-t="t2"></li><li data-t="t3"></li><li data-t="t4"></li></ol>
      </div>
      <div class="bench">
        <h3 data-t="logTitle"></h3>
        <div class="tablebox"><table>
          <thead><tr><th>#</th><th data-t="cR"></th><th data-t="cL"></th><th data-t="cP"></th><th data-t="cMu"></th><th data-t="cQ"></th></tr></thead>
          <tbody id="l-tbody"><tr><td colspan="6" style="text-align:left;color:var(--muted)" data-t="logEmpty"></td></tr></tbody>
        </table></div>
        <p class="note" data-t="logNote"></p>
      </div>
    </div>
  </section>

  <!-- 03 PATIENT -->
  <section id="patient" role="tabpanel" class="station" hidden>
    <div class="bench">
      <div class="cases" id="c-cases"></div>
      <canvas class="vessel" id="cv-patient"></canvas>
      <div class="playbar" data-sim="patient"></div>
      <div class="readout"><span class="big" id="c-flow"></span><span class="unit" data-t="flowUnit"></span></div>
      <div class="gauge" aria-hidden="true"><div class="fill" id="c-fill"></div><div class="target" style="left:45%"></div><span class="tl" style="left:45%" data-t="target"></span></div>
      <div class="ctrl"><label for="c-P" data-t="bp"></label><output id="c-P-out"></output><input type="range" id="c-P" min="100" max="200" step="5" value="100"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn accent" id="c-stent" aria-pressed="false" data-t="stentOn"></button>
        <button class="btn accent" id="c-bypass" aria-pressed="false" data-t="bypassOn"></button>
        <button class="btn ghost" id="c-math" data-t="showMath"></button>
      </div>
      <div id="c-status" class="result"></div>
      <div id="c-formula" class="formula" hidden></div>
    </div>
    <div class="side">
      <div class="bench">
        <h2 data-t="missionTitle"></h2>
        <p class="task" style="font-size:15px" data-t="mission"></p>
        <h3 data-t="discussTitle"></h3>
        <ol class="tasks"><li data-t="d1"></li><li data-t="d2"></li><li data-t="d3"></li></ol>
      </div>
    </div>
  </section>

  <div class="below">
    <details>
      <summary data-t="limitsTitle"></summary>
      <p data-t="limitsIntro"></p>
      <ul><li data-t="lim1"></li><li data-t="lim2"></li><li data-t="lim3"></li><li data-t="lim4"></li><li data-t="lim5"></li><li data-t="lim6"></li></ul>
    </details>
    <details>
      <summary data-t="teachTitle"></summary>
      <ul><li data-t-html="te0"></li><li data-t-html="te1"></li><li data-t-html="te2"></li><li data-t-html="te3"></li><li data-t-html="te4"></li><li data-t-html="te5"></li><li data-t-html="te6"></li></ul>
    </details>
  </div>
</div>

let lang="en";
const t=(k,v={})=>{let s=T[lang][k];return typeof s==="string"?s.replace(/\{(\w+)\}/g,(_,x)=>v[x]??""):s};
const fmt=q=> q>=10? Math.round(q).toString() : (Math.round(q*10)/10).toString();
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Vessel simulation (Poiseuille profile + continuity) ---------- */
class VesselSim{
  constructor(canvas,opts={}){
    this.c=canvas; this.ctx=canvas.getContext("2d");
    this.geom={r:1,s:1,f:0,a:0.45,stent:false,bypass:false}; this.flow=1; this.flowSeg=null; this.flowGraft=0;
    this.cyF=opts.cy||0.5; this.r0F=opts.r0||0.28; this.bps=[]; for(let i=0;i<26;i++) this.bps.push({t:Math.random(),e:(Math.random()*2-1)*0.8});
    this.paused=reduceMotion; this.frozen=false; this.speed=1; this.showProfile=!!opts.profile; this.ghost=!!opts.ghost;
    this.ps=[]; for(let i=0;i<150;i++) this.ps.push({x:Math.random(),e:(Math.random()*2-1)*0.92});
    this.capped=false;
    new ResizeObserver(()=>this.resize()).observe(canvas); this.resize();
  }
  resize(){const d=devicePixelRatio||1,w=this.c.clientWidth,h=this.c.clientHeight;this.c.width=w*d;this.c.height=h*d;this.ctx.setTransform(d,0,0,d,0,0);this.w=w;this.h=h;this.draw();}
  rAt(x){const g=this.geom;const r=g.r;if(g.f<=0||g.s>=1)return r;const a=g.a,b=g.a+g.f,tp=0.035;
    const sm=k=>k*k*(3-2*k);
    if(x<a-tp||x>b+tp)return r; if(x>=a&&x<=b)return r*g.s;
    const k=x<a?(x-(a-tp))/tp:((b+tp)-x)/tp; return r*(1-(1-g.s)*sm(Math.max(0,Math.min(1,k))));}
  inSeg(x){const g=this.geom;return g.f>0&&x>=g.a-0.035&&x<=g.a+g.f+0.035;}
  vmean(x){const rl=this.rAt(x);if(rl<0.03)return 0;const q=(this.flowSeg!==null&&this.inSeg(x))?this.flowSeg:this.flow;return q/(rl*rl);}
  tick(dt){ if(this.paused||this.frozen)return; this.advance(dt*this.speed); }
  advance(dt){
    const BASE=1/6, CAP=7; this.capped=false;
    for(const p of this.ps){let vm=this.vmean(p.x); if(vm>CAP){vm=CAP;this.capped=true;}
      const g=this.geom,blockedAhead=g.s<=0&&g.f>0;
      if(blockedAhead&&this.rAt(p.x)<0.03){continue;}
      let nx=p.x+vm*2*(1-p.e*p.e)*dt*BASE;
      if(blockedAhead&&p.x<g.a-0.035&&nx>=g.a-0.035){nx=g.bypass?g.a+g.f+0.04:Math.min(nx,g.a-0.036);}
      p.x=nx; if(p.x>1)p.x-=1;}
    if(this.geom.bypass){const g=this.geom,len=1.3*(g.f+0.14);let vm=Math.min(this.flowGraft,CAP);
      for(const b of this.bps){b.t+=vm*2*(1-b.e*b.e)*dt*BASE/len;if(b.t>1)b.t-=1;}}
  }
  draw(){
    const ctx=this.ctx,w=this.w,h=this.h,cy=h*this.cyF,R0=h*this.r0F,N=120;
    ctx.clearRect(0,0,w,h);
    const X=x=>x*w;
    // wall band
    const wallT=10;
    ctx.fillStyle=css("--wall");
    ctx.beginPath();for(let i=0;i<=N;i++){const x=i/N;ctx.lineTo(X(x),cy-this.geom.r*R0-wallT);}for(let i=N;i>=0;i--){const x=i/N;ctx.lineTo(X(x),cy+this.geom.r*R0+wallT);}ctx.fill();
    // plaque (between full radius and narrowed lumen)
    ctx.fillStyle=css("--plaque");
    ctx.beginPath();for(let i=0;i<=N;i++){const x=i/N;ctx.lineTo(X(x),cy-this.geom.r*R0);}for(let i=N;i>=0;i--){const x=i/N;ctx.lineTo(X(x),cy+this.geom.r*R0);}ctx.fill();
    // lumen
    ctx.fillStyle=css("--lumen");
    ctx.beginPath();for(let i=0;i<=N;i++){const x=i/N;ctx.lineTo(X(x),cy-this.rAt(x)*R0);}for(let i=N;i>=0;i--){const x=i/N;ctx.lineTo(X(x),cy+this.rAt(x)*R0);}ctx.fill();
    // ghost of normal vessel
    if(this.ghost&&Math.abs(this.geom.r-1)>0.01){ctx.setLineDash([5,5]);ctx.strokeStyle=css("--muted");ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(0,cy-R0);ctx.lineTo(w,cy-R0);ctx.moveTo(0,cy+R0);ctx.lineTo(w,cy+R0);ctx.stroke();ctx.setLineDash([]);}
    // stent mesh
    if(this.geom.stent){const a=X(this.geom.a-0.02),b=X(this.geom.a+this.geom.f+0.02),r=this.geom.r*R0;ctx.strokeStyle=css("--muted");ctx.lineWidth=1.5;
      ctx.beginPath();const n=10;for(let i=0;i<=n;i++){const xx=a+(b-a)*i/n;ctx.lineTo(xx,cy+(i%2?r:-r));}ctx.stroke();
      ctx.beginPath();for(let i=0;i<=n;i++){const xx=a+(b-a)*i/n;ctx.lineTo(xx,cy+(i%2?-r:r));}ctx.stroke();}
    // bypass graft (schematic)
    let gpt=null;
    if(this.geom.bypass){const g=this.geom,xa=X(g.a-0.07),xb=X(g.a+g.f+0.07),yT=cy-g.r*R0+2,peak=Math.max(14,cy-g.r*R0-R0*1.7),gr=R0*0.32;
      const xm=(xa+xb)/2,cyq=2*peak-yT;
      gpt=(t,e)=>{const u=1-t,x=u*u*xa+2*u*t*xm+t*t*xb,y=u*u*yT+2*u*t*cyq+t*t*yT;const dx=2*u*(xm-xa)+2*t*(xb-xm),dy=2*u*(cyq-yT)+2*t*(yT-cyq),L=Math.hypot(dx,dy)||1;return [x-dy/L*e*gr*0.75,y+dx/L*e*gr*0.75];};
      const path=()=>{ctx.beginPath();ctx.moveTo(xa,yT);ctx.quadraticCurveTo(xm,cyq,xb,yT);};
      ctx.lineCap="butt";ctx.strokeStyle=css("--wall");ctx.lineWidth=2*gr+14;path();ctx.stroke();
      ctx.strokeStyle=css("--lumen");ctx.lineWidth=2*gr;path();ctx.stroke();
      ctx.fillStyle=css("--blood");for(const b of this.bps){const [x,y]=gpt(b.t,b.e);ctx.beginPath();ctx.ellipse(x,y,3.6,2.4,0,0,Math.PI*2);ctx.fill();}}
    // particles
    ctx.fillStyle=css("--blood");
    for(const p of this.ps){const rl=this.rAt(p.x)*R0;if(rl<2)continue;ctx.beginPath();ctx.ellipse(X(p.x),cy+p.e*(rl-3),4,2.6,0,0,Math.PI*2);ctx.fill();}
    // velocity profile
    if(this.showProfile){const x0=0.12,rl=this.rAt(x0)*R0,vm=Math.min(this.vmean(x0),7);const sc=Math.min(w*0.18, w*0.06*vm);
      ctx.strokeStyle=css("--tech");ctx.fillStyle=css("--tech");ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(X(x0),cy-rl);ctx.lineTo(X(x0),cy+rl);ctx.stroke();
      ctx.beginPath();for(let i=0;i<=30;i++){const e=-1+2*i/30;ctx.lineTo(X(x0)+sc*(1-e*e),cy+e*rl);}ctx.stroke();
      for(const e of[-0.66,-0.33,0,0.33,0.66]){const L=sc*(1-e*e),y=cy+e*rl;if(L<6)continue;ctx.beginPath();ctx.moveTo(X(x0),y);ctx.lineTo(X(x0)+L,y);ctx.stroke();
        ctx.beginPath();ctx.moveTo(X(x0)+L,y);ctx.lineTo(X(x0)+L-5,y-3);ctx.lineTo(X(x0)+L-5,y+3);ctx.fill();}}
    if(this.capped&&!this.paused&&!this.frozen){ctx.fillStyle=css("--muted");ctx.font="11px "+css("--mono");ctx.fillText(t("capped"),8,h-8);}
  }
}

/* playbar: learner control */
function playbar(el,sim,opts={}){
  el.innerHTML="";
  const pb=document.createElement("button");pb.className="btn ghost";
  const sync=()=>{pb.textContent=sim.paused?"▶ "+t("resume"):"❚❚ "+t("play");};sync();
  pb.onclick=()=>{sim.paused=!sim.paused;sync();};
  const sb=document.createElement("button");sb.className="btn ghost";sb.textContent="⏭ "+t("step");
  sb.onclick=()=>{if(sim.frozen)return;sim.paused=true;sync();sim.advance(0.12);};
  const lab=document.createElement("span");lab.textContent=t("speed");
  const seg=document.createElement("span");seg.className="seg";
  [0.25,0.5,1].forEach(v=>{const b=document.createElement("button");b.textContent=v+"×";b.setAttribute("aria-pressed",sim.speed===v);
    b.onclick=()=>{sim.speed=v;[...seg.children].forEach(c=>c.setAttribute("aria-pressed",c===b));};seg.appendChild(b);});
  el.append(pb,sb,lab,seg);
  const cl=document.createElement("label");cl.className="chk";const cb=document.createElement("input");cb.type="checkbox";cb.checked=sim.showProfile;
  cb.onchange=()=>sim.showProfile=cb.checked;cl.append(cb,document.createTextNode(t("profile")));el.appendChild(cl);
  sim._sync=sync;
}

/* ---------- 01 Plaque: artery, longitudinal section, plaque grows from both walls ---------- */
const ease=k=>k<0?0:k>1?1:k*k*(3-2*k);
function seeded(n,seed){let s=seed;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};return Array.from({length:n},()=>[r(),r(),r()]);}
const LDL=seeded(14,7), LDL2=seeded(14,19), MONO=seeded(4,11), MONO2=seeded(4,23);
function drawArtery(ctx,w,h,stage,p,o={}){
  ctx.clearRect(0,0,w,h);
  const k=h/240, yc=h/2, yOut=8*k, yInt=46*k, cx=w*0.5, half=w*0.24;
  const TS=[0,0,6,16,36], T=(TS[stage-1]+(TS[stage]-TS[stage-1])*ease(p))*k;
  const bump=x=>{const d=(x-cx)/half;return Math.abs(d)>=1?0:Math.pow(Math.cos(d*Math.PI/2),2);};
  const endo=x=>yInt+4*k+T*bump(x);
  const N=90,X=i=>i/N*w;
  ctx.fillStyle=css("--lumen");ctx.fillRect(0,yInt,w,h-2*yInt);
  const side=(ldl,mono)=>{
    // wall
    ctx.fillStyle=css("--wall");ctx.fillRect(0,yOut,w,14*k);
    ctx.fillStyle=css("--media");ctx.fillRect(0,yOut+14*k,w,yInt-yOut-14*k);
    ctx.strokeStyle=css("--wall");ctx.lineWidth=1.1;
    for(let r=0;r<2;r++)for(let x=(r%2)*12;x<w;x+=24){const y=yOut+14*k+(r+0.6)*(yInt-yOut-14*k)/2.3;ctx.beginPath();ctx.ellipse(x,y,9*k,2.2*k,0,0,Math.PI*2);ctx.stroke();}
    // intima / plaque body
    ctx.fillStyle=css("--intima");ctx.beginPath();for(let i=0;i<=N;i++)ctx.lineTo(X(i),yInt);for(let i=N;i>=0;i--)ctx.lineTo(X(i),endo(X(i)));ctx.fill();
    if(stage>=4){const g=stage===4?ease(p):1;
      ctx.fillStyle=css("--plaque");ctx.globalAlpha=0.9;ctx.beginPath();ctx.ellipse(cx,yInt+T*0.45,half*0.6*g+1,T*0.36+1,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle=css("--cap");ctx.lineWidth=6*k*g+0.5;ctx.beginPath();for(let i=0;i<=N;i++){const x=X(i);if(Math.abs(x-cx)<half*0.85)ctx.lineTo(x,endo(x)-3*k);}ctx.stroke();}
    if(stage>=2){const pp=stage===2?ease(p):1;ctx.fillStyle=css("--plaque");
      for(const [a,b] of ldl){const tx=cx+(a-0.5)*half*1.2,ty=yInt+2*k+(endo(tx)-yInt-4*k)*b,sx=tx-30*k+a*20*k,sy=yc-6*k-b*18*k;
        if(stage>=4&&Math.abs(tx-cx)<half*0.5)continue;
        ctx.globalAlpha=stage>=3?0.55:1;ctx.beginPath();ctx.arc(sx+(tx-sx)*pp,sy+(ty-sy)*pp,2.8*k+0.5,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
    if(stage>=3){const pp=stage===3?p:1;
      mono.forEach(([a,b],i)=>{const tx=cx+(a-0.5)*half*1.1,ty=yInt+(endo(tx)-yInt)*(0.35+0.35*b),sx=tx+26*k,sy=yc-6*k;
        const m=ease(Math.min(1,pp*2)),f=ease(Math.max(0,pp*2-1)),x=sx+(tx-sx)*m,y=sy+(ty-sy)*m,r=(4.5+3.5*f)*k;
        ctx.globalAlpha=stage>=4?0.5:1;
        ctx.fillStyle=f>0.05?css("--intima"):css("--tech");ctx.strokeStyle=css("--tech");ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
        if(f>0.05){ctx.fillStyle=css("--plaque");for(let j=0;j<5;j++){const an=j*1.3+i;ctx.beginPath();ctx.arc(x+Math.cos(an)*r*0.45,y+Math.sin(an)*r*0.45,1.6*k*f+0.3,0,Math.PI*2);ctx.fill();}}
        ctx.globalAlpha=1;});}
    // endothelium
    ctx.fillStyle=css("--cap");
    for(let x=4;x<w;x+=14*k+4){const y=endo(x),d=Math.abs(x-cx)/half;let s=1;
      if(d<0.45)s=stage===1?1-0.55*ease(p):0.45;
      ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(endo(x+2)-endo(x-2),4));if(d<0.45)ctx.rotate((x%3-1)*0.25*(1-s));
      if(d<0.45&&stage===1)ctx.fillStyle=css("--blood");ctx.fillRect(-6*k*s,-2*k,12*k*s,4*k);ctx.fillStyle=css("--cap");ctx.restore();}
  };
  side(LDL,MONO);
  ctx.save();ctx.translate(0,h);ctx.scale(1,-1);side(LDL2,MONO2);ctx.restore();
  // red blood cells: faster where the lumen is narrow (continuity)
  if(o.rbc){const h0=yc-yInt-4*k;ctx.fillStyle=css("--blood");
    for(const c of o.rbc){const hl=yc-endo(c.x*w);if(o.dt)c.x=(c.x+o.dt*0.05*(h0/hl))%1;
      const x=c.x*w,top=endo(x)+4*k,bot=h-endo(x)-4*k;ctx.beginPath();ctx.ellipse(x,top+(bot-top)*c.b,4.3*k,2.7*k,0,0,Math.PI*2);ctx.fill();}}
  if(o.labels){ctx.textAlign="left";ctx.fillStyle=css("--ink");ctx.font=`${Math.round(11*k+1)}px ${css("--mono")}`;
    ctx.fillText(t("lWall"),8,yOut+20*k);ctx.fillText(t("lLum"),8,yc+22*k);
    const st=t("st")[stage-1];
    const lab=(txt,x,y,lx,ly)=>{ctx.strokeStyle=css("--tech");ctx.fillStyle=css("--tech");ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(lx,ly);ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();ctx.font=`600 ${Math.round(12*k+1)}px ${css("--body")}`;ctx.textAlign=lx>x?"left":"right";ctx.fillText(txt,lx+(lx>x?4:-4),ly+4);};
    if(p>0.3){
      if(stage===1)lab(st.lbl,cx,endo(cx),cx+half*1.15,yc);
      if(stage===2)lab(st.lbl,cx+half*0.3,yInt+5*k,cx+half*1.2,yc-4*k);
      if(stage===3)lab(st.lbl,cx-half*0.2,yInt+(endo(cx)-yInt)*0.55,cx+half*1.2,yc);
      if(stage===4){lab(st.lbl,cx-half*0.3,yInt+T*0.45,cx-half*1.2,yc-6*k);lab(st.lbl2,cx+half*0.4,endo(cx+half*0.4)-3*k,cx+half*1.2,yc-6*k);
        ctx.strokeStyle=css("--blood");ctx.fillStyle=css("--blood");ctx.lineWidth=1.5;const a=endo(cx)+2,b=h-endo(cx)-2;
        ctx.beginPath();ctx.moveTo(cx,a);ctx.lineTo(cx,b);ctx.stroke();
        [[a,1],[b,-1]].forEach(([y,s])=>{ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx-4,y+6*s);ctx.lineTo(cx+4,y+6*s);ctx.fill();});
        ctx.font=`600 ${Math.round(12*k+1)}px ${css("--body")}`;ctx.textAlign="left";ctx.fillText(st.lbl3,cx+8,yc+4);}}}
}
function fitCanvas(c){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=w*d;c.height=h*d;}const ctx=c.getContext("2d");ctx.setTransform(d,0,0,d,0,0);return{ctx,w,h};}
const mkRbc=n=>seeded(n,3).map(([a,b])=>({x:a,b:0.08+b*0.84}));

const PL={stage:1,p:reduceMotion?1:0,paused:false,mode:"order",order:[],cards:[],rbc:mkRbc(26)};
function plShuffle(){let a;do{a=[1,2,3,4].sort(()=>Math.random()-0.5);}while(a.join()==="1,2,3,4");PL.cards=a;PL.order=[];$("pl-ores").hidden=true;plCards();}
function plCards(){const box=$("pl-cards");box.innerHTML="";
  PL.cards.forEach(st=>{const b=document.createElement("button");b.className="card";b.setAttribute("aria-label","Snapshot");const c=document.createElement("canvas");b.appendChild(c);b._st=st;
    const idx=PL.order.indexOf(st);if(idx>=0){const s=document.createElement("span");s.className="badge";s.textContent=idx+1;b.appendChild(s);}
    b.onclick=()=>{const i=PL.order.indexOf(st);if(i>=0)PL.order.splice(i,1);else PL.order.push(st);$("pl-ores").hidden=true;plCards();};
    box.appendChild(b);requestAnimationFrame(()=>{const {ctx,w,h}=fitCanvas(c);drawArtery(ctx,w,h,st,1,{rbc:mkRbc(16)});});});
  $("pl-check").disabled=PL.order.length!==4;}
$("pl-check").onclick=()=>{let k=0;
  [...$("pl-cards").children].forEach(b=>{const ok=PL.order.indexOf(b._st)+1===b._st;if(ok)k++;b.classList.add(ok?"good":"bad");});
  const r=$("pl-ores");r.hidden=false;r.className="result "+(k===4?"good":"bad");r.textContent=k===4?t("orderOk"):t("orderBad",{k});};
$("pl-shuffle").onclick=plShuffle;
document.querySelectorAll("#pl-mode button").forEach(b=>b.onclick=()=>{PL.mode=b.dataset.m;plMode();});
function plMode(){document.querySelectorAll("#pl-mode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===PL.mode));
  $("pl-order").hidden=PL.mode!=="order";$("pl-anim").hidden=PL.mode!=="anim";plInfo();}
function plGo(n){PL.stage=Math.max(1,Math.min(4,n));PL.p=reduceMotion?1:0;PL.paused=false;plInfo();}
function plInfo(){
  if(PL.mode==="order"){$("pl-step").textContent="";$("pl-h").textContent=t("mOrder").replace(/^\d · /,"");$("pl-txt").textContent=t("orderSide");}
  else{const st=t("st")[PL.stage-1];$("pl-step").textContent=t("stepOf",{n:PL.stage});$("pl-h").textContent=st.h;$("pl-txt").textContent=st.txt;}
  const chips=$("pl-chips");chips.innerHTML="";for(let i=1;i<=4;i++){const b=document.createElement("button");b.textContent=i;b.setAttribute("aria-pressed",i===PL.stage);b.onclick=()=>plGo(i);chips.appendChild(b);}
  $("pl-prev").textContent=t("prev");$("pl-next").textContent=t("nextS");$("pl-replay").textContent=t("replay");
  $("pl-pause").textContent=PL.paused?"▶ "+t("resume"):"❚❚ "+t("play");
  $("pl-prev").disabled=PL.stage===1;$("pl-next").disabled=PL.stage===4;}
$("pl-prev").onclick=()=>plGo(PL.stage-1);$("pl-next").onclick=()=>plGo(PL.stage+1);
$("pl-replay").onclick=()=>plGo(PL.stage);
$("pl-pause").onclick=()=>{PL.paused=!PL.paused;plInfo();};
function plTick(dt){
  if(PL.mode!=="anim")return;
  const run=!PL.paused;if(run)PL.p=Math.min(1,PL.p+dt/3.2);
  const {ctx,w,h}=fitCanvas($("cv-plaque"));drawArtery(ctx,w,h,PL.stage,PL.p,{rbc:PL.rbc,dt:run?dt:0,labels:true});
}

/* ---------- 02 Predict ---------- */
const ROUNDS=[80,70,50];
const P={i:0,locked:false,score:0,res:[]};
function pSetup(){
  const r=ROUNDS[P.i]/100;sims.predict.geom.r=r;sims.predict.flow=Math.pow(r,4);sims.predict.frozen=true;
  $("p-task").innerHTML=t("task",{n:P.i+1,r:ROUNDS[P.i]});
  $("p-guess").disabled=false;$("p-lock").hidden=false;$("p-next").hidden=true;$("p-result").hidden=true;P.locked=false;
  pClearGuess();
}
function pSetGuess(v){$("p-guess-out").textContent=v+" %";$("p-guess").classList.remove("unset");$("p-lock").disabled=P.locked;}
function pClearGuess(){$("p-guess").value=0;$("p-guess-out").textContent="– %";$("p-guess").classList.add("unset");$("p-lock").disabled=true;}
$("p-guess").addEventListener("input",e=>pSetGuess(+e.target.value));
$("p-lock").onclick=()=>{
  if($("p-guess").classList.contains("unset"))return;
  const g=+$("p-guess").value,a=Math.pow(ROUNDS[P.i]/100,4)*100,d=Math.abs(g-a),pts=Math.max(0,Math.round(100-d*2));
  P.score+=pts;P.res.push({r:ROUNDS[P.i],g,a});P.locked=true;sims.predict.frozen=false;
  $("p-guess").disabled=true;$("p-lock").hidden=true;$("p-score").textContent=P.score;
  const box=$("p-result");box.hidden=false;box.className="result "+(pts>=70?"good":pts<30?"bad":"");
  box.innerHTML=t("resActual",{a:fmt(a),g,d:fmt(d),p:pts});
  if(P.i<ROUNDS.length-1){$("p-next").hidden=false;}else{box.innerHTML+="<br>"+t("resEnd",{s:P.score});$("p-restart").hidden=false;$("lg-curves").hidden=false;}
  drawPlot();
};
$("p-next").onclick=()=>{P.i++;pSetup();};
$("p-restart").onclick=()=>{P.i=0;P.score=0;P.res=[];$("p-score").textContent=0;$("p-restart").hidden=true;$("lg-curves").hidden=true;pSetup();drawPlot();};

function drawPlot(){
  const c=$("cv-plot"),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const ctx=c.getContext("2d");ctx.setTransform(d,0,0,d,0,0);
  const m={l:40,r:12,t:10,b:30},x0=40,x1=105,y0=0,y1=110;
  const X=v=>m.l+(v-x0)/(x1-x0)*(w-m.l-m.r),Y=v=>h-m.b-(v-y0)/(y1-y0)*(h-m.t-m.b);
  ctx.font="11px "+css("--mono");ctx.fillStyle=css("--muted");ctx.strokeStyle=css("--line");ctx.lineWidth=1;
  for(const v of[0,25,50,75,100]){ctx.beginPath();ctx.moveTo(m.l,Y(v));ctx.lineTo(w-m.r,Y(v));ctx.stroke();ctx.textAlign="right";ctx.fillText(v,m.l-6,Y(v)+4);}
  ctx.textAlign="center";for(const v of[40,50,60,70,80,90,100]){ctx.fillText(v,X(v),h-m.b+16);}
  ctx.textAlign="right";ctx.fillText("r %",w-m.r,h-4);ctx.textAlign="left";ctx.fillText("Q %",m.l+4,m.t+10);
  const done=P.res.length===ROUNDS.length;
  if(done){const curve=(pw,dash,lbl)=>{ctx.setLineDash(dash);ctx.strokeStyle=css("--ink");ctx.lineWidth=1.6;ctx.beginPath();
      for(let v=x0;v<=x1;v+=1){const q=Math.pow(v/100,pw)*100;if(q>y1)break;ctx.lineTo(X(v),Y(q));}ctx.stroke();ctx.setLineDash([]);
      const vl=pw===4?72:pw===2?62:50,q=Math.pow(vl/100,pw)*100;ctx.fillStyle=css("--ink");ctx.textAlign="right";ctx.fillText(lbl,X(vl)-6,Y(q)-4);};
    curve(1,[2,4],"∝ r");curve(2,[6,4],"∝ r²");curve(4,[],"∝ r⁴");}
  for(const p of P.res){ctx.strokeStyle=css("--tech");ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(p.r),Y(Math.min(p.g,y1)),6,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=css("--blood");ctx.beginPath();ctx.arc(X(p.r),Y(p.a),4.5,0,Math.PI*2);ctx.fill();}
}
new ResizeObserver(drawPlot).observe($("cv-plot"));

/* ---------- 02 Lab ---------- */
const LV=["r","L","P","mu"];let logRows=[];
function labState(){const o={};LV.forEach(k=>o[k]=+$("l-"+k).value);return o;}
function labFlow(s){return Math.pow(s.r/100,4)*(s.P/100)/((s.L/100)*(s.mu/100))*100;}
function labUpdate(){const s=labState();LV.forEach(k=>$("l-"+k+"-out").textContent=s[k]+" %");
  const q=labFlow(s);$("l-flow").textContent=fmt(q)+" %";const sim=sims.lab;const f=0.3*s.L/100;sim.geom={r:1,s:s.r/100,f,a:0.5-f/2,stent:false};sim.flow=q/100;}
LV.forEach(k=>$("l-"+k).addEventListener("input",labUpdate));
$("l-reset").onclick=()=>{LV.forEach(k=>$("l-"+k).value=k==="r"?70:100);labUpdate();};
$("l-log").onclick=()=>{const s=labState();s.q=labFlow(s);const prev=logRows[logRows.length-1];
  s.chg=prev?LV.filter(k=>prev[k]!==s[k]):[];logRows.push(s);
  $("l-warn").hidden=!(s.chg.length>1);if(s.chg.length>1)$("l-warn").textContent=t("warnMulti",{k:s.chg.length});renderLog();};
function renderLog(){const tb=$("l-tbody");if(!logRows.length){tb.innerHTML=`<tr><td colspan="6" style="text-align:left;color:var(--muted)">${t("logEmpty")}</td></tr>`;return;}
  tb.innerHTML=logRows.map((s,i)=>`<tr><td>${i+1}</td>${LV.map(k=>`<td class="${s.chg.includes(k)?"chg":""}">${s[k]}</td>`).join("")}<td><b>${fmt(s.q)}</b></td></tr>`).join("");}

/* ---------- 03 Patient ---------- */
const CASES=[{s:0.8,f:0.2},{s:0.64,f:0.2},{s:0,f:0.3}];
const GRAFT=1.3; // graft length relative to the bypassed segment
const C={i:0,treat:"none",math:false,refused:false};
function caseButtons(){const box=$("c-cases");box.innerHTML="";t("cases").forEach((c,i)=>{const b=document.createElement("button");b.className="case";
  b.setAttribute("aria-pressed",i===C.i);b.innerHTML=`${c.n}<small>${c.d}</small>`;b.onclick=()=>{C.i=i;C.treat="none";C.refused=false;$("c-P").value=100;caseButtons();cUpdate();};box.appendChild(b);});}
function cModel(cs,treat,P){
  const f=cs.f,s=treat==="stent"?1:cs.s,Rseg=s>0?f/Math.pow(s,4):Infinity,Rg=GRAFT*f;
  const Rpar=treat==="bypass"?1/((Rseg===Infinity?0:1/Rseg)+1/Rg):Rseg;
  const R=(1-f)+Rpar,q=R===Infinity?0:P/R;
  const qSeg=Rseg===Infinity?0:(Rpar===Infinity?0:q*Rpar/Rseg),qG=treat==="bypass"?q*Rpar/Rg:0;
  return {s,R,q,qSeg,qG};}
function cUpdate(){
  const cs=CASES[C.i],P=+$("c-P").value,m=cModel(cs,C.treat,P),q=m.q;
  const R0=(1-cs.f)+(cs.s>0?cs.f/Math.pow(cs.s,4):Infinity),need=R0===Infinity?null:Math.ceil(90*R0);
  $("c-P-out").textContent=P+" %";$("c-flow").textContent=fmt(q)+" %";$("c-fill").style.width=Math.min(100,q/2)+"%";
  const sim=sims.patient;sim.geom={r:1,s:m.s,f:cs.f,a:0.5-cs.f/2,stent:C.treat==="stent",bypass:C.treat==="bypass"};
  sim.flow=q/100;sim.flowSeg=C.treat==="bypass"?m.qSeg/100:null;sim.flowGraft=m.qG/100;
  const st=$("c-status");
  if(C.refused){st.className="result bad";st.textContent=t("stentNo");}
  else if(P>=150){st.className="result bad";st.textContent=t(q>=90?"crisisOk":"crisis",{p:P,mm:Math.round(1.2*P),q:fmt(q)});}
  else if(q>=90&&C.treat==="bypass"&&cs.s>0){st.className="result";st.textContent=t("bypassOverkill",{q:fmt(q)});}
  else if(q>=90&&C.treat==="bypass"){st.className="result good";st.textContent=t("bypassOk",{q:fmt(q)});}
  else if(q>=90){st.className="result "+(P>130?"":"good");st.textContent=P>130?t("stOkHigh",{p:P}):t("stOk",{q:fmt(q)});}
  else if(cs.s<=0){st.className="result bad";st.textContent=t("blocked");}
  else if(P>=200){st.className="result bad";st.textContent=t("stMax",{q:fmt(q),need});}
  else{st.className="result bad";st.textContent=t("stLow",{q:fmt(q)});}
  $("c-stent").textContent=C.treat==="stent"?t("stentOff"):t("stentOn");$("c-stent").setAttribute("aria-pressed",C.treat==="stent");
  $("c-bypass").textContent=C.treat==="bypass"?t("bypassOff"):t("bypassOn");$("c-bypass").setAttribute("aria-pressed",C.treat==="bypass");
  $("c-math").textContent=C.math?t("hideMath"):t("showMath");
  $("c-formula").hidden=!C.math;
  $("c-formula").innerHTML=t("mathLine",{R:m.R===Infinity?"∞":Math.round(m.R*100)/100,q:fmt(q),f:cs.f,s:m.s,need:need===null?t("impossible"):need+" %",extra:C.treat==="bypass"?t("mathBypass",{g:GRAFT}):""});
}
$("c-P").addEventListener("input",()=>{C.refused=false;cUpdate();});
$("c-stent").onclick=()=>{C.refused=false;if(C.treat==="stent"){C.treat="none";}else if(CASES[C.i].s<=0){C.refused=true;C.treat="none";}else C.treat="stent";cUpdate();};
$("c-bypass").onclick=()=>{C.refused=false;C.treat=C.treat==="bypass"?"none":"bypass";cUpdate();};
$("c-math").onclick=()=>{C.math=!C.math;cUpdate();};

/* ---------- tabs, language ---------- */
const tabs=["plaque","predict","lab","patient"];
tabs.forEach(id=>$("tab-"+id).onclick=()=>{active=id;tabs.forEach(o=>{$(o).hidden=o!==id;$("tab-"+o).setAttribute("aria-selected",o===id);});if(sims[id])sims[id].resize();if(id==="predict")drawPlot();if(id==="plaque")plCards();});
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("[data-t-html]").forEach(el=>el.innerHTML=t(el.dataset.tHtml));
  
  document.querySelectorAll(".playbar[data-sim]").forEach(el=>playbar(el,sims[el.dataset.sim]));
  $("p-task").innerHTML=t("task",{n:P.i+1,r:ROUNDS[P.i]});
  if(P.res.length){const last=P.res[P.res.length-1],d=Math.abs(last.g-last.a);$("p-result").innerHTML=t("resActual",{a:fmt(last.a),g:last.g,d:fmt(d),p:Math.max(0,Math.round(100-d*2))})+(P.res.length===ROUNDS.length?"<br>"+t("resEnd",{s:P.score}):"");}
  renderLog();caseButtons();cUpdate();plInfo();if(!$("l-warn").hidden){const l=logRows[logRows.length-1];$("l-warn").textContent=t("warnMulti",{k:l.chg.length});}
}


pSetup();labUpdate();plShuffle();plMode();applyLang();drawPlot();
</script>
